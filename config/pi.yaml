# agri-edge configuration for the Raspberry Pi 5 + AI HAT.
#
# Differs from example.yaml in three ways that matter:
#   - inference is ON, pointing at a real model
#   - bands are plain RGB (the Pi camera is not multispectral)
#   - QA thresholds are looser, because a live camera at altitude is not a
#     bench setup and an over-tight gate spools nothing

site: field-trial
field_id: plot-01

capture:
  # Camera Module 3 (IMX708) full resolution, 16:9. Drop to [2304, 1296] for
  # 2x2 binning if the Pi cannot keep up -- measure FPS first rather than
  # guessing. Keep 16:9: a 4:3 request crops the sensor, and then
  # camera_geometry.sensor_width_mm no longer describes the image.
  #
  # Until 24 Sept 2026 this was [4056, 3040] -- the HQ camera's resolution.
  resolution: [4608, 2592]
  interval_s: 1.0
  output_dir: ./data/raw
  max_telemetry_age_s: 2.0

qa:
  # CALIBRATE THIS BEFORE TRUSTING IT. Laplacian variance is sensor- and
  # scene-dependent; 100 is a starting point from bench imagery, not a
  # measurement of your camera at altitude. Fly a known-sharp pass, read the
  # reported values out of the spool sidecars, and set the threshold below the
  # 5th percentile of that distribution.
  blur_threshold: 100.0

  overexposed_fraction: 0.05
  underexposed_fraction: 0.05
  saturation_high: 250
  saturation_low: 5

  # 3 = 3D fix. Raise require_rtk_fixed for plot research or any cross-date
  # comparison; leave it false for general scouting, where a metre of positional
  # error does not change the agronomic conclusion.
  min_fix_type: 3
  require_rtk_fixed: false
  max_hdop: 2.5
  min_satellites: 6

  # RGB camera: no multispectral bands to require. Listing bands that the sensor
  # cannot produce fails every frame.
  required_bands: []

inference:
  enabled: true

  # backend: onnx   -> CPU, works everywhere, slower. Start here.
  #          hailo  -> the AI HAT NPU. Needs a .hef from scripts/hailo_compile.sh
  #                    and `sudo apt install hailo-all`.
  backend: onnx
  # The species model, NOT weed_crop_yolox_s. That one was trained on
  # ground-level close-ups and indoor seed trays -- one of its own test images
  # contains a person's boot -- so it is a seedling detector, not a field model.
  # This one was verified as genuine nadir aerial imagery before training.
  model_path: models/imageweeds_yolox_s.onnx

  # 0.30 is a scouting threshold: it tolerates false positives because a human
  # reviews the output. Raise it before anything downstream acts automatically.
  confidence_threshold: 0.30

  input_size: [640, 640]
  class_names: [ragweed, waterhemp, horseweed, redrootpigweed, kochia]

  # Report every detection under one label, keeping the model's own prediction in
  # the sidecar as `source_label`. Leave null to report the model's classes.
  #
  # Left null deliberately: the species model reports species.
  #
  # At epoch 75 this model had collapsed onto one class and collapsing to `weed`
  # was the honest choice. Training to 150 epochs fixed it -- horseweed (0.793),
  # ragweed (0.642) and kochia (0.624) are now usable, and species is what
  # determines which chemical a farmer reaches for.
  #
  # Set this to `weed` if you would rather have the higher aggregate number
  # (binary AP@.50 0.673 vs species 0.457) and no species claim at all. Note that
  # redrootpigweed (0.153) and waterhemp (0.073) are NOT reliable either way --
  # treat those two labels as "a weed". See models/imageweeds_yolox_s_CARD.md.
  collapse_labels_to: null

  # TILED INFERENCE -- for small targets this is not an optimisation, it is the
  # difference between detectable and invisible.
  #
  # Letterboxing a 4608-wide frame to 640x640 discards 7.2x of linear resolution
  # BEFORE the detector runs. A 3 cm weed seedling is then sub-pixel at any
  # useful altitude. Tiling slices the frame at native resolution instead.
  #
  #   3 cm seedling    whole-frame: below 0.6 m AGL   tiled: below 3.9 m
  #   25 cm weed       whole-frame: below 5.1 m       tiled: below 32 m
  #   100 cm patch     whole-frame: below 20.5 m      tiled: below 130 m
  #
  # Run training/gsd_calculator.py for your camera and target size.
  # Measured 2.3x more detections than whole-frame on real test imagery.
  #
  # Cost: one inference per tile. A 4608x2592 frame at tile 640 / overlap 0.2 is
  # 45 tiles. On the Pi CPU that is far too slow -- use the Hailo backend, or
  # lower capture.resolution, before enabling this in flight.
  tiled: false
  tile_size: 640
  tile_overlap: 0.2
  max_tiles: 64

# Where a detection's pixels become a place on the ground. Off by default:
# without a real AGL altitude and heading, every position would be fiction.
#
# These come off the camera's datasheet. A wrong focal length scales every
# ground position by a constant, which looks exactly like a GNSS offset.
camera_geometry:
  enabled: false
  sensor_width_mm: 6.45     # IMX708 active width (4608 px x 1.4 um), NOT the 7.4 mm diagonal
  focal_length_mm: 4.74
  # Camera rotation on the airframe, clockwise from "top of image at the nose".
  # 90 for a camera bolted on sideways. Wrong here rotates an entire flight.
  yaw_offset_deg: 0.0
  # How far the real ground may sit from the flat plane the projection assumes.
  # Feeds the per-detection error budget. Measure your field, or fit a
  # rangefinder and stop guessing.
  terrain_uncertainty_m: 2.0

# WHERE APPLICATION IS PERMITTED -- not where the aircraft may fly.
#
# Two boundaries, deliberately. The aircraft may fly the whole field; treatment
# is forced off buffer_m inside the edge, because an aircraft flying the
# boundary still has to turn around and will overshoot. Gate application on the
# flight boundary alone and every headland turn sprays over the fence.
#
# Leave null and NO detection is ever marked treatable. That is the safe
# default: a farm cannot leave decision-support mode without deciding where
# treatment is allowed.
#
# This computes the answer. Enforcement belongs on the payload controller,
# independent of this computer, so a fault here cannot open a valve.
treatment_zone:
  boundary_geojson: null    # path to a GeoJSON Polygon, EPSG:4326
  buffer_m: 10.0

spool:
  spool_dir: ./data/spool
  # Sized for a 128 GB card with headroom for the OS. The quota evicts uploaded
  # payloads first, then QA-failed frames oldest-first, and never evicts an
  # anomaly frame.
  max_bytes: 68719476736   # 64 GB
  upload_endpoint: null

# Push flight observations into farmOS (https://farmos.org), a real farm record
# system. Leave url null to skip it -- running offline is the normal case.
#
# NO CREDENTIALS HERE, DELIBERATELY. This file is committed to git. farmOS uses
# OAuth2, and a leaked client secret is not fixed by rotating one key. The
# username, password and client secret are read from the environment:
#
#   export FARMOS_USERNAME=... FARMOS_PASSWORD=... FARMOS_CLIENT_SECRET=...
#   agri-edge -c config/pi.yaml spool --upload --upload-to farmos
#
# Only the sidecars travel, never the images: a flight is gigabytes of frames and
# kilobytes of decisions, and the decisions are what a farm record needs.
farmos:
  url: null
  # farmOS land asset this site maps to. Without it the logs are still created,
  # just not attached to a field.
  land_asset_id: ""
  timeout_s: 20.0

mavlink:
  # Read-only. The Pi cannot command the aircraft -- see the safety contract in
  # telemetry/mavlink_link.py.
  #
  # For a wired connection to a Pixhawk on the Pi's UART, use:
  #   connection: /dev/serial0:921600
  connection: udpin:0.0.0.0:14550
  source_system: 200
  heartbeat_timeout_s: 5.0

# Live reports to the farm's ops station (iot/edge_publisher.py). Best effort:
# the spool stays the record. Credentials come from the environment
# (OPS_API_TOKEN for http, MQTT_USERNAME / MQTT_PASSWORD for mqtt).
publish:
  enabled: false
  transport: mqtt          # mqtt | http
  mqtt_host: 192.168.1.10
  mqtt_port: 1883
  farm_id: farm
  vehicle_id: scout1
  health_every_frames: 10
