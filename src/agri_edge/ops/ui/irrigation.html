<main>
<h1>Irrigation</h1>
<div id="content" class="card">Loading…</div>
</main>
<script>
async function get(path){ const r=await fetch(path); return r.json(); }
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

(async()=>{
  const i=await get('/api/ops/irrigation');
  const zones=(i.zones||[]);
  const rows=zones.map(z=>`<tr><td>${esc(z.zone_id)}</td><td>${esc(z.avg_moisture_pct??'')}</td><td>${esc(z.valve_id??'')}</td><td>${esc(z.valve_open_pct??'')}</td><td>${esc(z.flow_lpm??'')}</td><td>${esc(z.recommendation?.action??'')}</td></tr>`).join('');
  document.getElementById('content').innerHTML=`<h3>Zones</h3><table border=1 cellpadding=6 style="border-collapse:collapse;width:100%;background:#0a120a"><tr><th>Zone</th><th>Moisture %</th><th>Valve</th><th>Open %</th><th>Flow LPM</th><th>Rec</th></tr>${rows}</table><pre>${esc(JSON.stringify(i,null,2))}</pre>
  <p>Safety: auto_execute=false · mqtt_ground_only · no AI unrestricted pump</p>`;
})();

</script>
</body></html>
