# Mosquitto for the ground IoT bus. Fails closed: no anonymous clients, a
# password per client, and an ACL that limits what each one may publish.
#
# Before the first `docker compose up`, create the password file:
#
#     bash ground_iot/mosquitto/make_passwd.sh
#
# Mosquitto refuses to start without it. That is deliberate -- the previous
# config accepted anonymous clients on every interface, so anything on the
# farm network could publish `.../irrigation/set` and open a valve.

per_listener_settings false
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout

# Plain MQTT. docker-compose.yml publishes it on 127.0.0.1 only; to take
# sensors off the host, publish it on the LAN *and* enable TLS below.
listener 1883

# Websockets for Node-RED / a browser dashboard on the same host.
listener 9001
protocol websockets

# TLS for field devices. Uncomment once certificates exist in ./certs
# (mounted at /mosquitto/certs) and publish 8883 instead of 1883.
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# tls_version tlsv1.2
