# Mosquitto + Node-RED beside agri-edge (ground IoT — not the flight Pi)
#
#   docker compose -f ground_iot/docker-compose.yml up -d
#
# Do NOT merge Node-RED / Mosquitto source into agri-edge.
# Irrigation MQTT commands must NEVER be bridged to MAVLink / the aircraft.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: agriedge-mosquitto
    # Loopback only. Exposing the broker to the farm LAN is a decision, not a
    # default: switch to the TLS listener in mosquitto.conf when you make it.
    ports:
      - "127.0.0.1:1883:1883"
      - "127.0.0.1:9001:9001"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/acl:/mosquitto/config/acl:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    restart: unless-stopped

  nodered:
    # Pinned: `latest` changes under you between two `up`s.
    image: nodered/node-red:4.0
    container_name: agriedge-nodered
    # The editor can deploy any flow, including one that publishes
    # irrigation/set. Loopback only until adminAuth is set in settings.js.
    ports:
      - "127.0.0.1:1880:1880"
    environment:
      - TZ=America/Toronto
    volumes:
      - nodered_data:/data
    depends_on:
      - mosquitto
    restart: unless-stopped

volumes:
  mosquitto_data:
  mosquitto_log:
  nodered_data:
