name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # The runtime targets Raspberry Pi OS Bookworm (Python 3.11) and is developed
    # on 3.12. Both are tested so a 3.12-only idiom cannot reach the aircraft.
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the runtime core only
        # Deliberately NOT the full dev extras. This step doubles as a check that
        # the Pi runtime really does install with numpy and PyYAML alone -- if
        # someone adds torch to the core dependencies, this is where it shows up,
        # as a multi-minute install rather than a few seconds.
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify the dependency boundary
        # Runs first and alone: if the runtime has grown a heavy dependency, that
        # is the finding, and the rest of the suite is noise on top of it.
        run: pytest tests/test_runtime_deps.py -q

      - name: Run the suite
        # Integration tests skip themselves when no exported model or dataset is
        # present, which is the case on a clean runner.
        run: pytest -q


  # ---------------------------------------------------------------------------
  # Static analysis. Separate job, because a lint failure and a test failure are
  # different findings and burying one in the other wastes a run.
  #
  # This job also exists because `make lint` used to exit 0 when ruff was not
  # installed, and nothing ran it anywhere. A linter that is never invoked is
  # not a linter.
  # ---------------------------------------------------------------------------
  static:
    name: lint and typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff mypy

      # Through the Makefile deliberately, so the target a developer types is
      # the target CI proves works. The Windows dev machine has no `make`, so
      # without this the Makefile is verified nowhere.
      - name: make lint
        run: make lint

      - name: make format --check
        run: ruff format --check src tests training workstation mechanical scripts
        continue-on-error: true   # advisory until the tree is formatted once

      # A ratchet, not a gate and not a shrug. Every remaining error was read
      # individually and none is a defect -- each is a type-NARROWING
      # limitation: a value guarded by a runtime check mypy cannot follow
      # (`if self.has_position:`), a dict of callables, numpy list-vs-ndarray.
      #
      # Failing the build on those would be noise. Letting the number drift
      # upward would lose the next real one in the crowd. So it is pinned: it
      # may fall, never rise.
      #
      # It earned its place on its first run. The heartbeat fix in
      # telemetry/mavlink_link.py pushed the count 24 -> 25 and CI caught it.
      # The right response was not a higher ceiling: `self._conn` was inferred
      # as None because it had no annotation, and typing it `Any` -- pymavlink
      # is an optional extra, so the annotation cannot name its class -- fixed
      # four errors at once. The same shape in capture/camera.py made five.
      # Renaming a variable that was reused for three different types across
      # branches that each return took it to 11.
      - name: make typecheck (ratchet)
        run: |
          set +e
          make typecheck | tee /tmp/mypy.txt
          set -e
          found=$(grep -oE "Found [0-9]+ error" /tmp/mypy.txt | grep -oE "[0-9]+" || echo 0)
          echo "mypy errors: $found (ceiling 11)"
          if [ "$found" -gt 11 ]; then
            echo "New type errors. Fix them, or justify a higher ceiling here."
            exit 1
          fi

      - name: make build
        run: make build

  # ---------------------------------------------------------------------------
  # The operations station is a separate repository (Anwarito-lbd/agri-edge-web)
  # and is NOT built here. The 19 Sept audit recorded that it has no tests and
  # no CI of its own, with a command-proxy route as its least-covered surface;
  # that workflow belongs in that repo. This comment is here so the gap stays
  # visible rather than being forgotten because nothing references it.
  # ---------------------------------------------------------------------------

  # Second job, deliberately separate. The lean job above proves the Pi runtime
  # installs with numpy + PyYAML alone; this one proves the code that NEEDS the
  # optional extras actually works.
  #
  # Without it those tests skip silently on CI and only ever run on a developer's
  # machine -- which is how the MAVLink fault matrix, the OpenCV paths and the
  # ONNX backend could all rot without anyone noticing a green tick.
  extras:
    name: with optional extras
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install with the extras those tests need
        # pymavlink   -> tests/test_mavlink_faults.py (real MAVLink over UDP)
        # opencv      -> green-on-brown fast paths, YOLOX letterbox comparisons
        # onnxruntime -> the deployed inference engine
        # Pillow      -> WebODM geotagging
        # rasterio    -> Sentinel-2 reader (warps UTM COGs onto a field grid)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pymavlink opencv-python-headless onnxruntime pillow rasterio

      - name: Confirm the optional tests are actually running
        # A skip here is indistinguishable from a pass in the summary line, so
        # assert the count instead of trusting the tick.
        #
        # test_webodm.py is on this list because it importorskips Pillow. That
        # skip is correct in the lean job and would be a silent regression here,
        # which is exactly the shape of bug this step exists to catch.
        run: |
          for f in tests/test_mavlink_faults.py tests/test_webodm.py tests/test_satellite.py; do
            echo "--- $f"
            pytest "$f" -q --no-header -rN | tee /tmp/opt.txt
            grep -qE "[0-9]+ passed" /tmp/opt.txt
            if grep -qE "no tests ran|skipped" /tmp/opt.txt; then
              echo "$f skipped -- its optional dependency did not install."
              exit 1
            fi
          done

      - name: Run the suite
        run: pytest -q
